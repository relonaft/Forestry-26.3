modLoader = "javafml"
loaderVersion = "{fmlVersionRange}"
issueTrackerURL = "https://github.com/relonaft/Forestry-26.3/issues"

license = "GNU Lesser Public License v3"

[[mods]]
modId = "forestry"
version = "${version}"
displayName = "Forestry"
displayURL = "https://github.com/relonaft/Forestry-26.3"
logoFile = "forestry-ce-logo-banner.png"
credits = "mistaqur, Binnie, CovertJaguar, MysteriousAges, Nirek, Temp1011, ramidzkh, EnderiumSmith, Spearkiller"
authors = "thedarkcolour, SirSengir, mezz, Nedelosk"
description ='''
Trees, bees and more.

Unofficial port to Minecraft 26.3. Not made or supported by the Forestry or Forestry: CE developers.
'''

[[dependencies.forestry]]
modId = "neoforge"
mandatory = true
versionRange = "${forgeVersionRange}"
ordering = "NONE"
side = "BOTH"

[[dependencies.forestry]]
modId = "jei"
type = "OPTIONAL"
versionRange = "${jeiVersionRange}"
ordering = "NONE"
side = "CLIENT"
